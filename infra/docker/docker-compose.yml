version: "3.9"

name: batman

services:
  # ── PRIMARY DATABASE: PostgreSQL + PostGIS ─────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: batman-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: batman
      POSTGRES_USER: batman
      POSTGRES_PASSWORD: batman_dev_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./../../data/seeds/init_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batman -d batman"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── GRAPH DATABASE: Neo4j ──────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.20-community
    container_name: batman-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/batman_neo4j_secret
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt protocol
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "batman_neo4j_secret", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── CACHE + MESSAGE BROKER: Redis ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: batman-redis
    restart: unless-stopped
    command: redis-server --requirepass batman_redis_secret
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "batman_redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── EVENT STREAMING: Apache Kafka ─────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: batman-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: batman-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── TIME SERIES DATABASE: InfluxDB ────────────────────────────────────────
  influxdb:
    image: influxdb:2.7-alpine
    container_name: batman-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: batman
      DOCKER_INFLUXDB_INIT_PASSWORD: batman_influx_secret
      DOCKER_INFLUXDB_INIT_ORG: batman-org
      DOCKER_INFLUXDB_INIT_BUCKET: batman-sensors
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: batman-influx-token-dev
    volumes:
      - influxdb_data:/var/lib/influxdb2
    ports:
      - "8086:8086"

  # ── DOCUMENT STORE: MongoDB (Mission Memory) ──────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: batman-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: batman
      MONGO_INITDB_ROOT_PASSWORD: batman_mongo_secret
      MONGO_INITDB_DATABASE: batman_memory
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"

  # ── IDENTITY & ACCESS MANAGEMENT: Keycloak ────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: batman-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: batman_kc_admin
      KC_DB: dev-mem
    volumes:
      - ./keycloak/batman-realm.json:/opt/keycloak/data/import/batman-realm.json
    ports:
      - "8443:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  # ── MAP TILE SERVER: GeoServer ────────────────────────────────────────────
  geoserver:
    image: kartoza/geoserver:2.25.0
    container_name: batman-geoserver
    restart: unless-stopped
    environment:
      GEOSERVER_ADMIN_USER: batman
      GEOSERVER_ADMIN_PASSWORD: batman_geo_secret
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
    ports:
      - "8090:8080"

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  zookeeper_data:
  kafka_data:
  influxdb_data:
  mongodb_data:
  geoserver_data:
